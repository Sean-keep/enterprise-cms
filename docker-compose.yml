name: enterprise-cms

# 挂载的是**整个 monorepo**，不是 backend/ 子目录 ——
# @cms/shared 靠 npm workspaces 解析，install 必须跑在根上，
# 把 backend 单独挂成 /app 会让 node_modules 落到子目录里，找不到 workspace 包。
services:
  backend:
    image: node:22-bookworm-slim
    working_dir: /app/backend
    command: >
      sh -c "cd /app && npm install --no-audit --no-fund
      && cd /app/backend
      && npx prisma generate
      && npx prisma db push --skip-generate
      && npm run db:seed
      && npx tsx watch --tsconfig ./tsconfig.json src/server.ts"
    environment:
      # 绝对路径，避免 prisma 相对路径解析歧义
      DATABASE_URL: file:/app/backend/prisma/data/cms.db
      BACKEND_PORT: "4000"
      BACKEND_HOST: 0.0.0.0
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      UPLOAD_DIR: uploads
      WEB_BASE_URL: http://web:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}
    volumes:
      - ./package.json:/app/package.json:ro
      - ./backend:/app/backend
      - ./packages:/app/packages
      - ./web:/app/web
      # 依赖和 prisma client 都落这个卷 —— 写容器文件系统重启就没了
      - node_modules:/app/node_modules
      - ./backend/prisma/data:/app/backend/prisma/data
      - ./backend/uploads:/app/backend/uploads
    ports:
      - "8891:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    image: node:22-bookworm-slim
    working_dir: /app/web
    # backend 先装依赖 + 建库 + seed，web 不重复 install，直接起
    depends_on:
      backend:
        condition: service_healthy
    command: npx next dev -H 0.0.0.0 -p 3000
    environment:
      API_BASE_URL: http://backend:4000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8890}
      WEB_BASE_URL: http://web:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}
    volumes:
      - ./package.json:/app/package.json:ro
      - ./web:/app/web
      - ./packages:/app/packages
      - node_modules:/app/node_modules
    ports:
      - "8890:3000"

volumes:
  node_modules:
